[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.1.0"
description = "Summarize recent commit activity across local git repositories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gitpulse = "gitpulse.cli:main"

[tool.setuptools]
packages = ["gitpulse"]
